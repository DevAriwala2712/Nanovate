[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovate"
version = "0.1.0"
description = "Training-free SEM topology defect verifier (synthetic-data prototype)"
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "scikit-image", "gdstk", "gudhi", "torch",
  "matplotlib", "pandas", "pytest",
]

[project.optional-dependencies]
# demonstrator app (python -m nanovate.app); pinned versions in requirements-app.txt. httpx: FastAPI TestClient (tests).
app = ["fastapi", "uvicorn", "pydantic", "python-multipart", "pillow", "tifffile", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # so tests can import the top-level experiments/ package
addopts = "-q"
